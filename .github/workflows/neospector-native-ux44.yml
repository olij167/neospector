name: Neospector native installers UX44

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already prepared and pushed to main'
        type: string
        required: true
      platforms:
        description: 'Comma-separated: linux,windows,macos'
        type: string
        required: true
        default: linux

permissions:
  contents: read

concurrency:
  group: neospector-native-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: verify
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,json,os,pathlib,re
          p=pathlib.Path('app_source/release_identity.py')
          tree=ast.parse(p.read_text())
          version=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign)
            and any(isinstance(t,ast.Name) and t.id=='VERSION' for t in n.targets))
          draft=json.loads(pathlib.Path('web/release_draft.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+-ux\d+',version),'Invalid release version'
          assert version==os.environ['CANDIDATE_VERSION']==draft['version'],'Version/draft mismatch'
          platforms=os.environ['REQUESTED_PLATFORMS'].split(',')
          assert all(x in {'linux','windows','macos'} for x in platforms) and len(platforms)==len(set(platforms)),'Unknown/repeated platform'
          assert platforms,'No requested platforms'
          PY
          echo 'version=${{ inputs.version }}' >> "$GITHUB_OUTPUT"
          echo 'commit=${{ github.sha }}' >> "$GITHUB_OUTPUT"

  linux-x64:
    if: contains(format(',{0},',inputs.platforms), ',linux,')
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk python3-venv ffmpeg xvfb xauth libgl1 libx11-6 libxext6 libxrender1
      - name: Build and audit frozen Linux DEB
        run: |
          set -euo pipefail
          xvfb-run -a bash native/build_linux_frozen_deb.sh
          PKG="artifacts/Neospector_${{ needs.validate.outputs.version }}_linux-x64.deb"
          dpkg-deb -f "$PKG" Package Version Architecture
          python3 scripts/verify_shipping.py "$PKG"
          python3 scripts/owner_ci_receipt.py --platform linux-x64 \
            --version '${{ needs.validate.outputs.version }}' \
            --commit '${{ needs.validate.outputs.commit }}' \
            --file "$PKG" --runner Linux --check shipping-audit --check package-verified
      - uses: actions/upload-artifact@v4
        with:
          name: neospector-native-linux-x64
          if-no-files-found: error
          path: |
            artifacts/Neospector_${{ needs.validate.outputs.version }}_linux-x64.deb
            artifacts/Neospector_${{ needs.validate.outputs.version }}_linux-x64.deb.sha256
            artifacts/ci-receipt-linux-x64.json

  windows-x64:
    if: contains(format(',{0},',inputs.platforms), ',windows,')
    needs: validate
    runs-on: windows-2025
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.NEOSPECTOR_WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.NEOSPECTOR_WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install innosetup -y --no-progress
      - name: Load required Windows publisher certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) {
            throw 'Windows signing secrets are missing. No unsigned release is allowed.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'neospector-publisher.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $cert=Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          Remove-Item -Force $pfx
          if (-not $cert) {throw 'Publisher certificate import failed'}
          "NEOSPECTOR_WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
      - name: Build and verify Windows Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          ./native/build_windows.ps1
          $pkg="artifacts/Neospector_$env:VERSION`_windows-x64_Setup.exe"
          if (-not (Test-Path $pkg)) {throw 'Missing native Setup.exe'}
          $s=Get-AuthenticodeSignature -LiteralPath $pkg
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Thumbprint -ne $env:NEOSPECTOR_WINDOWS_CERT_THUMBPRINT) {
            throw 'Native Windows publisher signature invalid'
          }
          python scripts/owner_ci_receipt.py --platform windows-x64 --version $env:VERSION `
            --commit $env:COMMIT --file $pkg --runner Windows --check authenticode-valid
      - uses: actions/upload-artifact@v4
        with:
          name: neospector-native-windows-x64
          if-no-files-found: error
          path: |
            artifacts/Neospector_${{ needs.validate.outputs.version }}_windows-x64_Setup.exe
            artifacts/Neospector_${{ needs.validate.outputs.version }}_windows-x64_Setup.exe.sha256
            artifacts/ci-receipt-windows-x64.json

  macos:
    if: contains(format(',{0},',inputs.platforms), ',macos,')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERT_P12: ${{ secrets.NEOSPECTOR_MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.NEOSPECTOR_MACOS_CERT_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.NEOSPECTOR_MACOS_KEYCHAIN_PASSWORD }}
      NEOSPECTOR_APPLE_APPLICATION_ID: ${{ secrets.NEOSPECTOR_APPLE_APPLICATION_ID }}
      NEOSPECTOR_APPLE_INSTALLER_ID: ${{ secrets.NEOSPECTOR_APPLE_INSTALLER_ID }}
      NEOSPECTOR_APPLE_TEAM_ID: ${{ secrets.NEOSPECTOR_APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.NEOSPECTOR_APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.NEOSPECTOR_APPLE_PASSWORD }}
      NEOSPECTOR_APPLE_NOTARY_PROFILE: neospector-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Load Developer ID and notary credentials
        shell: bash
        run: |
          set -euo pipefail
          for var in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_KEYCHAIN_PASSWORD NEOSPECTOR_APPLE_APPLICATION_ID NEOSPECTOR_APPLE_INSTALLER_ID NEOSPECTOR_APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            [[ -n "${!var:-}" ]] || { echo "Missing required macOS release credential: $var" >&2; exit 2; }
          done
          KEYCHAIN="$RUNNER_TEMP/neospector-build.keychain-db"
          printf %s "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/neospector-signing.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/neospector-signing.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/neospector-signing.p12"
          xcrun notarytool store-credentials "$NEOSPECTOR_APPLE_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$NEOSPECTOR_APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
      - name: Build, notarise and verify native macOS package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bash native/build_macos.sh
          PKG="artifacts/Neospector_${VERSION}_macos-${ARCH}.pkg"
          [[ -f "$PKG" ]] || { echo "Missing $PKG" >&2; exit 2; }
          pkgutil --check-signature "$PKG" | grep -F "$NEOSPECTOR_APPLE_TEAM_ID"
          xcrun stapler validate "$PKG"
          spctl --assess --type install "$PKG"
          python3 scripts/owner_ci_receipt.py --platform "macos-${ARCH}" --version "$VERSION" \
            --commit "$COMMIT" --file "$PKG" --runner macOS --check notarized --check developer-id-valid
      - uses: actions/upload-artifact@v4
        with:
          name: neospector-native-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            artifacts/Neospector_${{ needs.validate.outputs.version }}_macos-${{ matrix.arch }}.pkg
            artifacts/Neospector_${{ needs.validate.outputs.version }}_macos-${{ matrix.arch }}.pkg.sha256
            artifacts/ci-receipt-macos-${{ matrix.arch }}.json
